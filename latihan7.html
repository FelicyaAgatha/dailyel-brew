<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="containern mt-4">
    
    <div id="slide" class="carousel slide">
        
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img height="400px;" class="rounded mx-auto d-block"
 src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQql_ideExrL6dwQ73VFt1kCsxFFO9nllLCfkQkDOMXvw&s=10">
            </div>

            <div class="carousel-item">
                 <img height="400px;" class="rounded mx-auto d-block"
 src="https://static.vecteezy.com/system/resources/thumbnails/049/541/065/small/strawberry-cheesecake-topped-with-fresh-strawberries-and-drizzled-with-sweet-strawberry-sauce-creamy-and-rich-photo.jpeg">
            </div>

            <div class="carousel-item">
                <img height="400px;" class="rounded mx-auto d-block" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbUeemNk8YH4DMKIYHgWp8GtLNNMqUPC-LxSsgO6eCxA&s=10">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#slide" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#slide" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    </div>
</body>
</html>
