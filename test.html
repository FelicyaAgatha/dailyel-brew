<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-4">
        <button class="btn btn-primary text-success" data-bs-toggle="modal" data-bs-target="#contoh">Klik Disini❄️</button>
    </div>

    <div class="modal" id="contoh">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary">Selamat datang🪻</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="text-danger">hai</p>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success">save</button>
                    <button class="btn btn-danger" data-bs-dismiss="modal">close</button>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
