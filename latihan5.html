<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form control</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

     <script>const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))</script>

</head>
<body>

    <div class="container mt-3 bg-danger rounded-4">

        <div class="mt-4">
             <h2 class="text-center text-primary">FORMULIR PENDAFTARAN SISWA BARU</h2>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Masukan NIPD" class="form-control">
            <label>NIPD</label>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
             <label>Nama Lengkap</label>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Email" class="form-control">
             <label>Email</label>
        </div>

        <div class="mb-3 form-floating">
            <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
             <label>Alamat Lengkap</label>
        </div>

        <div class="mb-3 form-floating">
            <select class="form-select">
                <option>Rekasyasa Perangkat Lunak</option>
                <option>Teknik Komputer dan Jaringan</option>
                <option>Desain Komunikasi Visual</option>
                <option>Bisnis Digital</option>
                <option>Akutansi</option>
            </select>
            <label>PILIH JURUSAN</label>
        </div>

        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul pramuka</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul paskib</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul pmr</label>
        </div>


        <div class="mb-3">
            <div class="row">
                <div class="col-6">
            <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Laki-laki</label>
            </div>
            <div class=""col-6>
            <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Perempuan</label>
         </div>
    </div>
 </div>
         <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Untuk simpan data">Simpan Data</button>

         <button class="btn btn-success">Hapus Data</button>
    </div>

</body>
</html>
